<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учёт рабочего времени</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Учёт рабочего времени</h1>

    <section>
      <h2>Сотрудники</h2>
      <form id="employee-form" class="row">
        <label class="grow">Имя сотрудника
          <input id="employee-name" name="name" placeholder="Например, Анна Тестова" maxlength="100"
                 autocomplete="off" required aria-describedby="employee-error">
        </label>
        <button type="submit">Добавить</button>
      </form>
      <p id="employee-error" class="error" role="alert"></p>
      <ul id="employees" class="employees"></ul>
      <p id="employees-empty" class="muted" hidden>Сотрудников пока нет. Добавьте первого в форме выше.</p>
      <!-- Start and stop of a timer, for screen readers. The per-second counters are not live regions. -->
      <p id="timer-status" class="visually-hidden" role="status" aria-atomic="true"></p>
    </section>

    <section>
      <h2>Отчёт</h2>
      <form id="report-form" class="row">
        <label>С <input type="date" id="report-from" required></label>
        <label>По <input type="date" id="report-to" required></label>
        <label>Сотрудник
          <select id="report-employee"><option value="">Все</option></select>
        </label>
        <button type="submit">Показать</button>
      </form>
      <p id="report-error" class="error" role="alert"></p>

      <h3>Итого за период</h3>
      <table>
        <thead><tr><th>Сотрудник</th><th class="num">Время</th></tr></thead>
        <tbody id="totals"></tbody>
      </table>

      <h3>Записи</h3>
      <p id="entries-empty" class="muted" hidden>
        Нет записей за период. Выберите другие даты или запустите таймер у сотрудника.
      </p>
      <!-- On a narrow screen the table scrolls inside this block, not the whole page. -->
      <div class="table-wrap" tabindex="0" role="region" aria-label="Записи за период">
        <table id="entries-table">
          <thead>
            <tr><th>Сотрудник</th><th>Задача</th><th>Начало</th><th>Конец</th><th class="num">Длительность</th></tr>
          </thead>
          <tbody id="entries"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
